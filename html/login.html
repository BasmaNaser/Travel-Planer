<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="icon" type="img/png" href="../imgs/download (1).webp">

    <style>
      body{
    transition: all 0.5s linear;
    animation: appear 1s linear ;
    overflow: hidden;
}
@keyframes appear {
    0%{
        transform: translate(-1500px,0);
        opacity: 0;
    }
    25%{
                opacity: .25;
    }

    50%{
                opacity: .5;
    }
    75%{
                opacity: .75;
                transform: translate(0,0);

    }
    100%{
        opacity: 1;
    }
}
        body::-webkit-scrollbar {
            display: none;
        }

        .left {
            /* background-image: url(./imgs/download.png);
            background-size: cover; */
            height: 90vh;
        }

        a{
            text-decoration: none;
        }
        a:hover{
            text-decoration: underline;
        }
        @media (min-width:768px) {
            #width-change {
                width: 75%;
            }
        }
        
    </style>
</head>

<body class="bg-light" style=" font-family: 'Inter', sans-serif;">
    <div class="">
        <div style="border-radius: 15px;" class="bg-white  d-flex m-sm-4 h-100 align-items-center m-2 overflow-hidden justify-content-center">
            <div class="w-100 left d-sm-block d-none position-relative">
                <img src="../imgs/ChatGPT Image Aug 15, 2026, 04_49_14 AM.png" alt="" class="w-100 h-100">
                
            </div>

            <div class="w-100 bg-white mt-4 m-3">
                <div class=" m-auto" id="width-change">
                    <div class="d-flex align-items-center mb-2" style="color: #0ea5a8;">
                        <i class="fa-solid fa-suitcase-rolling fw-bolder fs-4" style="width: 25px; height:40px"></i>
                        <p class="fw-bolder fs-4" style="letter-spacing: 1px;">TripMate</p>
                    </div>
                    <h3 class="text-capitalize fw-bold fs-2">Welcome Back 👋</h3>
                    <p class="text-secondary">Sign up to start planning your dream vacations.</p>
                    <div>

                        <form action="profile.html">
                            <div class="mb-2">
                                <label for="exampleInputEmail1" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="exampleInputEmail1"
                                    aria-describedby="emailHelp">
                            </div>
                            <div class="mb-2">
                                <label for="exampleInputPassword1" class="form-label">Password</label>
                                <div class="position-relative">
                                    <input type="password" class="form-control" id="exampleInputPassword1" aria-describedby="passwordHelp">
                                    <i class="fa-solid fa-eye position-absolute text-secondary fs-5 fw-semibold top-50 end-0 translate-middle-y me-3"
                                        id="togglePassword"
                                        style="cursor: pointer;"></i>
                                </div>                                
                            </div>
                            <div class="d-flex justify-content-between mt-3">
                                <div >
                                    <input type="checkbox" id="rememberMe">
                                    Remember Me
                                </div>
                                <p style="color: #0ea5a8; cursor:pointer" onclick="setTimeout(() => {
                                    window.open('forgetPasswordEmail.html','_blank')
                                }, 1000);">Forgot Password?</p>
                            </div>
                            <button type="submit" style="background-color: #0ea5a8; letter-spacing: 1px;"
                                class="btn text-white w-100 mt-3 fs-5">Login</button>
                        </form>
                        <p class="text-center m-2 text-secondary fs-6">Don't have an account? <a href="index.html"><span style="color: #0ea5a8;" >Create Account</span></a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/script2.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
</body>

</html>
