<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Bookings</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background: #f5f7fa;
        }


        .page-header {

            background: white;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);

        }


        .booking-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);

        }


        .table th {

            white-space: nowrap;

        }


        .table td {

            vertical-align: middle;

            white-space: nowrap;

        }


        .empty {

            padding: 50px !important;

            text-align: center;

            color: #777;

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                href="dashboard.html"
                class="navbar-brand">

                <i class="bi bi-airplane"></i>

                Travel Planner Admin

            </a>


            <button
                id="logoutBtn"
                class="btn btn-danger">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </nav>



    <!-- PAGE -->

    <div class="container mt-5">


        <!-- HEADER -->

        <div class="page-header">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h2>
                        Bookings
                    </h2>

                    <p class="text-muted mb-0">

                        Manage customer trip bookings

                    </p>

                </div>


                <span class="badge bg-success fs-6">

                    Total Bookings:

                    <span id="totalBookings">
                        0
                    </span>

                </span>

            </div>

        </div>



        <!-- TABLE -->

        <div class="booking-card">

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead class="table-success">

                        <tr>

                            <th>#</th>

                            <th>Customer</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Destination</th>

                            <th>Travel Date</th>

                            <th>Travelers</th>

                            <th>Price / Person</th>

                            <th>Total Price</th>

                        </tr>

                    </thead>


                    <tbody id="bookingsTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script>


        // =====================================
        // CHECK ADMIN
        // =====================================

        let admin =

            JSON.parse(
                localStorage.getItem("admin")
            ) ||

            JSON.parse(
                sessionStorage.getItem("admin")
            );


        if (!admin) {

            window.location.href =
                "login.html";

        }



        // =====================================
        // GET BOOKINGS
        // =====================================

        let bookings =

            JSON.parse(
                localStorage.getItem("bookings")
            ) || [];



        // =====================================
        // ELEMENTS
        // =====================================

        let bookingsTable =

            document.getElementById(
                "bookingsTable"
            );


        let totalBookings =

            document.getElementById(
                "totalBookings"
            );



        // =====================================
        // SHOW BOOKINGS
        // =====================================

        function showBookings() {


            bookingsTable.innerHTML = "";


            totalBookings.innerText =
                bookings.length;



            // NO BOOKINGS

            if (bookings.length === 0) {


                bookingsTable.innerHTML = `

                    <tr>

                        <td
                            colspan="9"
                            class="empty">

                            <i
                                class="bi bi-calendar-x fs-1">
                            </i>

                            <h5 class="mt-3">

                                No Bookings Yet

                            </h5>

                            <p>

                                Customer bookings will appear here.

                            </p>

                        </td>

                    </tr>

                `;


                return;

            }



            // SHOW BOOKINGS

            bookings.forEach(
                function(booking, index) {


                    bookingsTable.innerHTML += `

                        <tr>

                            <td>

                                ${index + 1}

                            </td>


                            <td>

                                <strong>

                                    ${booking.name || "Unknown"}

                                </strong>

                            </td>


                            <td>

                                ${booking.email || "-"}

                            </td>


                            <td>

                                ${booking.phone || "-"}

                            </td>


                            <td>

                                <span
                                    class="badge bg-primary">

                                    ${booking.destination || "-"}

                                </span>

                            </td>


                            <td>

                                ${booking.travelDate || "-"}

                            </td>


                            <td>

                                <span
                                    class="badge bg-secondary">

                                    ${booking.travelers || 0}

                                </span>

                            </td>


                            <td>

                                $${booking.price || 0}

                            </td>


                            <td>

                                <strong
                                    class="text-success">

                                    $${booking.totalPrice || 0}

                                </strong>

                            </td>

                        </tr>

                    `;

                }
            );

        }



        // =====================================
        // LOGOUT
        // =====================================

        document
            .getElementById("logoutBtn")
            .onclick = function() {


                localStorage.removeItem("admin");

                sessionStorage.removeItem("admin");


                window.location.href =
                    "home.html";

            };



        // =====================================
        // START
        // =====================================

        showBookings();


    </script>


</body>

</html>
