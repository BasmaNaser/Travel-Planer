<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Booking Receipt</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background: #f5f7fa;
        }


        .receipt {

            max-width: 650px;

            margin: 50px auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.1);

        }


        .success-icon {

            font-size: 70px;

        }


        .receipt-info {

            background: #f8f9fa;

            padding: 20px;

            border-radius: 15px;

        }


        .receipt-row {

            display: flex;

            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid #ddd;

        }


        .receipt-row:last-child {

            border-bottom: none;

        }


        .total {

            font-size: 22px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="receipt">


        <!-- Success -->

        <div class="text-center mb-4">

            <i
                class="bi bi-check-circle-fill text-success success-icon">
            </i>


            <h2 class="mt-3">

                Payment Successful

            </h2>


            <p class="text-muted">

                Your booking has been confirmed.

            </p>

        </div>



        <!-- Receipt -->

        <div class="receipt-info">


            <h5 class="mb-3">

                <i class="bi bi-receipt"></i>

                Booking Receipt

            </h5>


            <div class="receipt-row">

                <span>
                    Booking ID
                </span>

                <strong id="bookingId"></strong>

            </div>


            <div class="receipt-row">

                <span>
                    Customer
                </span>

                <strong id="name"></strong>

            </div>


            <div class="receipt-row">

                <span>
                    Email
                </span>

                <strong id="email"></strong>

            </div>


            <div class="receipt-row">

                <span>
                    Destination
                </span>

                <strong id="destination"></strong>

            </div>


            <div class="receipt-row">

                <span>
                    Travel Date
                </span>

                <strong id="travelDate"></strong>

            </div>


            <div class="receipt-row">

                <span>
                    Travelers
                </span>

                <strong id="travelers"></strong>

            </div>


            <div class="receipt-row">

                <span>
                    Payment Method
                </span>

                <strong id="paymentMethod"></strong>

            </div>


            <div class="receipt-row total">

                <span>
                    Total Price
                </span>

                <span class="text-success">

                    $<span id="totalPrice"></span>

                </span>

            </div>


        </div>



        <!-- Buttons -->

        <div class="text-center mt-4">


            <button
                class="btn btn-primary me-2"
                onclick="window.print()">

                <i class="bi bi-printer-fill"></i>

                Print Receipt

            </button>


            <a
                href="home.html"
                class="btn btn-outline-secondary">

                <i class="bi bi-house-fill"></i>

                Home

            </a>


        </div>


    </div>

</div>



<script>

    // Get paid booking

    let booking =
        JSON.parse(
            localStorage.getItem("paidBooking")
        );


    // Check booking

    if (!booking) {

        window.location.href =
            "home.html";

    }


    // Show receipt data

    document.getElementById("bookingId").innerText =
        booking.bookingId;

    document.getElementById("name").innerText =
        booking.name;

    document.getElementById("email").innerText =
        booking.email;

    document.getElementById("destination").innerText =
        booking.destination;

    document.getElementById("travelDate").innerText =
        booking.travelDate;

    document.getElementById("travelers").innerText =
        booking.travelers;

    document.getElementById("paymentMethod").innerText =
        booking.paymentMethod;

    document.getElementById("totalPrice").innerText =
        booking.totalPrice;

</script>


</body>

</html>
