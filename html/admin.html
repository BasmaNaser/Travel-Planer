<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <!-- Admin CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/navandFooter.css">

</head>
<nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="./home.html">
            Trip<span>Mate</span>
        </a>

        <!-- Mobile Button -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="destination.html">
                        Destination
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="./adminComplaints.html">
                        Complaints
                    </a>
                </li>

            </ul>

            <!-- Login -->
            <button class="btn btn-sm login-btn " id="mylogin">
                Logout
            </button>

        </div>
    </div>
</nav>

<body>
    <div class="container-fluid">

        <div class="row">

            <!-- ================= SIDEBAR ================= -->

            <div class="col-md-3 col-lg-2 sidebar text-white p-4">

                <h3 class="mb-5">

                    <i class="bi bi-airplane"></i>

                    Travel Planner

                </h3>


                <!-- Dashboard -->

                <div class="menu active">

                    <i class="bi bi-grid"></i>

                    Dashboard

                </div>


                <!-- Trips -->

                <div class="menu">

                    <i class="bi bi-airplane-engines"></i>

                    <a href="destination.html" style="color: inherit; text-decoration: none;">

                        Trips

                    </a>

                </div>


                <!-- Bookings -->

                <div class="menu">

                    <i class="bi bi-calendar-check"></i>

                    <a href="adbook.html" style="color: inherit; text-decoration: none;">

                        Bookings

                    </a>

                </div>

            </div>


            <!-- ================= MAIN ================= -->

            <div class="col-md-9 col-lg-10 p-4">


                <!-- ================= HEADER ================= -->

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h2>
                            Dashboard
                        </h2>

                        <span class="text-muted">

                            Welcome back, Admin

                        </span>

                    </div>

                </div>


                <!-- ================= STAT CARDS ================= -->

                <div class="row g-4 mb-4">


                    <!-- TOTAL USERS -->

                    <div class="col-md-4">

                        <div class="card stat-card p-4">

                            <div class="icon">

                                <i class="bi bi-people-fill"></i>

                            </div>

                            <p class="text-muted mb-1">

                                Total Users

                            </p>

                            <h2 id="totalUsers">

                                0

                            </h2>

                        </div>

                    </div>


                    <!-- TOTAL BOOKINGS -->

                    <div class="col-md-4">

                        <div class="card stat-card p-4">

                            <div class="icon">

                                <i class="bi bi-calendar2-check"></i>

                            </div>

                            <p class="text-muted mb-1">

                                Total Bookings

                            </p>

                            <h2 id="totalBookings">

                                0

                            </h2>

                        </div>

                    </div>


                    <!-- TOTAL TRIPS -->

                    <div class="col-md-4">

                        <div class="card stat-card p-4">

                            <div class="icon">

                                <i class="bi bi-airplane"></i>

                            </div>

                            <p class="text-muted mb-1">

                                Total Trips

                            </p>

                            <h2 id="totalTrips">

                                0

                            </h2>

                        </div>

                    </div>

                </div>


                <!-- ================= USERS TABLE ================= -->

                <div class="card users-card">

                    <div class="card-body">

                        <div class="mb-4">

                            <h4>

                                Registered Users

                            </h4>

                            <p class="text-muted">

                                Manage website users

                            </p>

                        </div>


                        <div class="table-responsive">

                            <table class="table table-hover align-middle">


                                <thead>

                                    <tr>

                                        <th>
                                            #
                                        </th>

                                        <th>
                                            Name
                                        </th>

                                        <th>
                                            Email
                                        </th>

                                        <th>
                                            Phone
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                    </tr>

                                </thead>


                                <tbody id="usersTable">

                                </tbody>


                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= ADMIN JS ================= -->

    <script src="../js/admin.js"></script>

</body>

</html>
