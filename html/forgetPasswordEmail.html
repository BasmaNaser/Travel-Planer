<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="icon" type="img/png" href="../imgs/download (1).webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            transition: all 0.5s linear;
            animation: appear 1s linear;
            /* overflow: hidden; */
            height: 88vh;
        }

        @keyframes appear {
            0% {
                transform: translate(-1500px, 0);
                opacity: 0;
            }

            25% {
                opacity: .25;
            }

            50% {
                opacity: .5;
            }

            75% {
                opacity: .75;
                transform: translate(0, 0);

            }

            100% {
                opacity: 1;
            }
        }

        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (min-width:768px) {
            #width-change {
                width: 75%;
            }
        }
    </style>
</head>

<body class="bg-light " style=" font-family: 'Inter', sans-serif;">
    <div class="text-center col-11 col-md-7 m-auto">
        <div style="border-radius: 15px;"
            class="bg-white  d-flex justify-content-center m-sm-4 align-items-center m-2 overflow-hidden justify-content-center">

            <div class="w-100 bg-white mt-4 m-3 ">
                <div class=" m-auto" id="width-change">
                    <div class="d-flex align-items-center justify-content-center  fs-2" style="color: #0ea5a8;">
                        <i class="fa-solid fa-suitcase-rolling fw-bolder fs-4" style="width: 25px; height:40px"></i>
                        <!-- <i class="fa-solid fa-spinner fa-spin"></i> -->
                        <!-- <i class="fa-regular fa-clock"></i> -->
                        <p class="fw-bolder fs-4" style="letter-spacing: 1px;">TripMate</p>

                    </div>
                    <h3 class="text-capitalize fw-bolder fs-3 mt-0">forgot password ?</h3>
                    <p class="text-secondary">enter your email address and we well send you a link to reset your
                        password.</p>
                    <div>

                        <form action="profile.html">
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="floatingInput"
                                    placeholder="name@example.com">
                                <label for="floatingInput">Email address</label>
                            </div>
                    </div>
                    <button type="submit" style="background-color: #0ea5a8; letter-spacing: 1px;"
                        class="btn text-white w-100 fs-6 fw-bold opacity-50">Send Reset Link </button>

                    </form>
                    <p class="text-center m-2 text-secondary fs-6 text-capitalize">Remember your password? <a
                            href="login.html"><span style="color: #0ea5a8;">back to login</span></a></p>
                </div>
            </div>
        </div>
    </div>
    </div>
        <script src="../js/script3.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
</body>

</html>
