<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/destination.css">

    <link rel="stylesheet" href="../css/navandFooter.css">
    <style>
        nav button:hover {
            background-color: white;
        }

        .navbar-toggler {
            border: 1px solid #d5e3e5 !important;
            padding: 7px 10px;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(14, 165, 168, 0.12);
        }
    </style>
</head>


<body>


    <nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold" href="./home.html">
                Trip<span>Mate</span>
            </a>

            <!-- Mobile Button -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation -->
            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav mx-auto" id="userNav">

                    <li class="nav-item">
                        <a class="nav-link" href="./home.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./about.html">
                            About Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./services.html">
                            Services
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./destination.html">
                            Destinations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./contact.html">
                            Contact Us
                        </a>
                    </li>

                </ul>


                <ul class="navbar-nav mx-auto d-none" id="adminNav">

                    <li class="nav-item">
                        <a class="nav-link" href="./admin.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Destinations
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./adminComplaints.html">
                            Complaints
                        </a>
                    </li>

                </ul>

                <!-- Login -->
                <button class="btn-sm login-btn " id="mylogin">
                    Login
                </button>
                <button class="btn login-btn ms-2" id="myprofile">
                    Profile
                </button>

            </div>
        </div>
    </nav>


    <div class="container text-center mt-4 mb-5 fs-2">

        <h1 style="color:#0bcac7;">
            Explore Destinations
        </h1>

        <p class="text-black fs-5">
            Discover amazing places around the world and find
            your perfect destination for your next adventure.
        </p>
    </div>

    <div class="container">

        <!-- SEARCH -->

        <div class="search-filters row g-2 align-items-center">

            <div class="col-lg-11">

                <div class="search-input">

                    <span><i class="bi bi-search"></i></span>

                    <input type="text" id="searchInput" placeholder="Where do you want to go?">



                </div>
            </div>

            <div class="col-lg-1">

                <button id="searchBtn" class="btn w-100">
                    Search
                </button>

            </div>



        </div>
        <div id="error"></div>


        <!-- ============================= -->
        <!-- ADMIN -->
        <!-- ============================= -->

        <div class="container admin-area">

            <button id="newCardBtn" class="btn">
                New Card
            </button>


            <!-- FORM -->

            <div id="cardForm" style="display: none;">

                <input type="text" id="name" placeholder="Name">

                <input type="text" id="country" placeholder="Country">

                <input type="file" id="cardImage" accept="image/*">

                <input type="number" id="rating" placeholder="Rating">

                <input type="text" id="description" placeholder="Description">

                <input type="number" id="price" placeholder="Price">
                <textarea id="about" class="form-control mb-2" placeholder="About Destination"></textarea>

                <textarea id="thingsToDo" class="form-control mb-2" placeholder="Things To Do"></textarea>

                <textarea id="food" class="form-control mb-2" placeholder="Food"></textarea>

                <textarea id="hotels" class="form-control mb-2" placeholder="Best Hotels"></textarea>

                <input type="text" id="bestTime" class="form-control mb-2" placeholder="Best Time To Visit">

                <input type="text" id="travelTips" class="form-control mb-2" placeholder="Travel Tips">

                <select id="category">

                    <option value="trending">
                        Trending
                    </option>

                    <option value="coastal">
                        Coastal
                    </option>

                    <option value="adventure">
                        Adventure
                    </option>

                    <option value="cultural">
                        Cultural
                    </option>

                </select>


                <button id="saveBtn" class="btn">
                    Add Card
                </button>

            </div>

        </div>




        <div class="container boxing">

            <h2 class="not">Trending</h2>

            <div id="trendingContainer" class="row g-4"></div>




            <h2 class="not">Coastal</h2>

            <div id="coastalContainer" class="row"></div>




            <h2 class="not">Adventure</h2>

            <div id="adventureContainer" class="row"></div>




            <h2 class="not">Cultural</h2>

            <div id="culturalContainer" class="row"></div>

        </div>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script src="../js/destination.js"></script>


</body>

</html>
